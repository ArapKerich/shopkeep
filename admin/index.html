<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopkeep – Inventory & Sales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#667585;--line:#dde3e9;--pri:#0d6b5c;--pri-ink:#fff;--warn:#f2b01e;--warn-bg:#fdf0cf;--bad:#c9372c;--bad-bg:#fbe3e0;--ok-bg:#d8f0ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--card:#18222c;--ink:#e8eef3;--mute:#8d9cab;--line:#2a3743;--pri:#35b89f;--pri-ink:#04201a;--warn-bg:#3a2f10;--bad:#ff7a6e;--bad-bg:#3d1f1c;--ok-bg:#123a33}}
:root[data-theme="dark"]{--bg:#0f161d;--card:#18222c;--ink:#e8eef3;--mute:#8d9cab;--line:#2a3743;--pri:#35b89f;--pri-ink:#04201a;--warn-bg:#3a2f10;--bad:#ff7a6e;--bad-bg:#3d1f1c;--ok-bg:#123a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0;letter-spacing:-.02em}
h1{font-size:28px;font-weight:800}h2{font-size:18px;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--ink);color:#e8eef3;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font:800 22px 'Bricolage Grotesque',sans-serif;padding:4px 10px 18px}
.brand i{font-style:normal;color:var(--warn)}
nav button.tab{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;color:#b9c6d2;display:flex;gap:10px;align-items:center;cursor:pointer}
nav a.tab{background:none;text-align:left;padding:10px 12px;border-radius:10px;color:#b9c6d2;display:flex;gap:10px;align-items:center;text-decoration:none;font-size:15px}
nav button.tab.on{background:#fff2;color:#fff;font-weight:700}
nav a.tab:hover{background:#fff2;color:#fff;font-weight:700}
.nav-section{font-size:11px;text-transform:uppercase;color:#8092a0;padding:12px 12px 2px}
.shop-link{display:block;margin-top:12px;padding:10px 12px;color:#fff;text-decoration:none;border:1px solid #fff3;border-radius:8px;font-size:13px}
.who{margin-top:auto;font-size:13px;color:#9fb0bf}
.who select{width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid #fff3;background:#fff1;color:#fff}
.who option{color:#14202b}
main{padding:28px;max-width:1100px;width:100%}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:2px 0 0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi small{color:var(--mute)}.kpi b{display:block;font:800 26px 'Bricolage Grotesque',sans-serif;margin-top:2px}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.bars{display:flex;align-items:end;gap:10px;height:150px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--mute)}
.bars span{width:100%;background:var(--line);border-radius:6px 6px 2px 2px}
.bars div:last-child span{background:var(--pri)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:500}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
.btn.bad{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);width:100%}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ok-bg);color:var(--pri);white-space:nowrap}
.pill.low{background:var(--warn-bg);color:#9a6a00}.pill.out{background:var(--bad-bg);color:var(--bad)}
.pill.refunded{background:var(--bad-bg);color:var(--bad)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mute);font-weight:500;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sell{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile:hover:not(:disabled){border-color:var(--pri)}
.tile:active:not(:disabled){transform:scale(.97)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile .e{font-size:32px;line-height:1.2}.tile b{font-weight:700}.tile small{color:var(--mute)}
.receipt{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);padding:18px 18px 26px;border-radius:14px 14px 0 0;
-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.line{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.line .n{flex:1;min-width:0}.line .n small{color:var(--mute);display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:none}
.tot{display:flex;justify-content:space-between;padding:3px 0;color:var(--mute)}
.tot.big{color:var(--ink);font:800 22px 'Bricolage Grotesque',sans-serif;margin-top:6px}
.empty{color:var(--mute);text-align:center;padding:26px 8px}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:10}
.box{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.box h2{margin-bottom:12px}
.f{display:grid;gap:10px}.f label{font-size:13px;color:var(--mute);display:grid;gap:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:20;max-width:90vw;box-shadow:0 8px 24px #0004}
.toast.warn{background:var(--warn);color:#14202b}
.alert{background:var(--warn-bg);border-radius:12px;padding:10px 14px;margin-bottom:14px;color:#9a6a00;font-weight:500}
.auth-main{max-width:520px;margin:8vh auto}.auth-main p{color:var(--mute)}
body.dashv{--bg:#eef1f4;--card:#fff;--ink:#000;--mute:#000;--line:#d3dae1;--pri:#0d6b5c;--pri-ink:#fff;--warn-bg:#fdf0cf;--bad:#c9372c;--bad-bg:#fbe3e0;--ok-bg:#d8f0ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alert{color:var(--warn)}}
body.dashv{--bg:#eef1f4;--card:#fff;--ink:#000;--mute:#000;--line:#d3dae1;--pri:#0d6b5c;--pri-ink:#fff;--warn-bg:#fdf0cf;--bad:#c9372c;--bad-bg:#fbe3e0;--ok-bg:#d8f0ea}
@media (max-width:860px){
.shell{grid-template-columns:1fr}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;justify-content:space-around}
nav{justify-content:flex-start;overflow-x:auto}
nav .brand,nav .who{display:none}
nav .shop-link{display:none}
nav button.tab{flex-direction:column;gap:0;padding:6px 10px;font-size:12px;text-align:center}
nav button.tab{flex:0 0 auto;font-size:10px;padding:6px 7px}
nav .nav-section{display:none}
nav a.tab{flex-direction:column;gap:0;padding:6px 4px;font-size:10px;text-align:center;white-space:nowrap}
main{padding:18px 14px 96px}
.kpis{grid-template-columns:1fr 1fr}.cols,.sell{grid-template-columns:1fr}.receipt{position:static}
.mrole{display:block!important}
}
.mrole{display:none}
@media (prefers-reduced-motion:no-preference){.box{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}}
</style>
<style>
.product-image-preview{display:block;width:100%;max-width:180px;aspect-ratio:1;object-fit:cover;border:1px solid var(--line);border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div class="shell">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="modal"></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
<script src="../backend/firebase-config.js"></script>
<script src="../backend/firebase.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const money=n=>'KSh '+Math.round(n).toLocaleString('en-KE'), TAX=.16;
let P=[
['SKU-1001','Maize flour 2kg','Pantry','🌽',175,195,40,15],['SKU-1002','Sugar 1kg','Pantry','🍬',170,200,22,10],
['SKU-1003','Cooking oil 1L','Pantry','🫒',280,340,9,12],['SKU-2001','Mandazi pack of 4','Bakery','🍩',20,40,14,10],
['SKU-2002','Bread, white loaf','Bakery','🍞',55,65,3,6],['SKU-2003','Chapati pack of 5','Bakery','🫓',30,60,0,8],
['SKU-3001','Eggs tray of 30','Pantry','🥚',420,480,18,8],['SKU-3002','Kericho tea leaves 250g','Drinks','🍵',95,130,11,5],
['SKU-3003','Fresh milk 500ml','Drinks','🥛',55,65,30,12],['SKU-4001','Tomatoes 1kg','Fresh','🍅',90,130,22,10],
['SKU-4002','Hass avocados (4)','Fresh','🥑',60,100,7,8],['SKU-4003','Sukuma wiki bunch','Fresh','🥬',10,20,16,8]
].map((a,i)=>({id:'p'+i,sku:a[0],name:a[1],cat:a[2],emoji:a[3],cost:a[4],price:a[5],stock:a[6],reorder:a[7]}));
let M=[],S=[],cart=[],disc=0,view='dash',role='owner',q='',user=null,storeId='',onlineOrders=[],teamUsers=[],pendingEmail='';
const now=()=>new Date();
const hm=d=>d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dm=d=>d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+hm(d);
const WEEK=[18400,23100,15900,26500,19800,29200];
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const ROLES={owner:'Admin',admin:'Admin',manager:'Staff',staff:'Staff',cashier:'Staff'};
const can={dash:['owner','admin','manager'],sell:['owner','admin','manager','staff','cashier'],prods:['owner','admin','manager','staff','cashier'],log:['owner','admin','manager'],edit:['owner','admin','manager','staff'],refund:['owner','admin','manager'],users:['owner','admin'],adduser:['owner','admin'],userlogs:['owner','admin'],orders:['owner','admin','manager','staff','cashier']};
const ok=k=>can[k].includes(role);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mv(p,type,qty,ref,note){p.stock+=qty;const movement={id:'M'+uid(),t:now(),pid:p.id,name:p.name,type,qty,ref,by:ROLES[role],note:note||''};M.unshift(movement);return movement}
const collection=name=>window.shopkeepDb.collection('shops').doc(storeId).collection(name);
async function persistChanges({products=[],sales=[],movements=[]}){
 const batch=window.shopkeepDb.batch();
 products.forEach(p=>batch.set(collection('products').doc(p.id),p));
 sales.forEach(s=>batch.set(collection('sales').doc(s.id),s));
 movements.forEach(m=>batch.set(collection('stock_movements').doc(m.id),m));
 await batch.commit();
 if(products.length){
  const catalogBatch=window.shopkeepDb.batch();products.forEach(p=>catalogBatch.set(collection('public_products').doc(p.id),{id:p.id,name:p.name,cat:p.cat,emoji:p.emoji,price:p.price,stock:p.stock,imageUrl:p.imageUrl||''}));
  try{await catalogBatch.commit()}catch(error){console.warn('Public catalog sync is unavailable.',error);toast('Store data saved, but catalog sync is blocked. Deploy backend/firestore.rules.',1)}
 }
}
async function persistOrReload(changes){
 try{await persistChanges(changes);return true}
 catch(e){if(user)await loadStore(user);toast('Could not save to Firebase: '+e.message,1);return false}
}
const dateValue=v=>v&&typeof v.toDate=='function'?v.toDate():new Date(v);
async function loadStore(current){
 const customer=await window.shopkeepDb.collection('customers').doc(current.uid).get();
 if(customer.exists){location.replace(`../store/?store=${encodeURIComponent(customer.get('storeId')||'')}`);return}
 const [membership,token]=await Promise.all([window.shopkeepDb.collection('shop_memberships').doc(current.uid).get(),current.getIdTokenResult()]);
 const claims=token.claims;
 if(membership.exists){
  if(membership.get('status')!=='active')throw new Error('This account has been removed from the store.');
  storeId=membership.get('storeId');role=membership.get('role');
  pendingEmail=membership.get('pendingEmail')||'';
  if(pendingEmail&&current.email&&current.email.toLowerCase()===pendingEmail.toLowerCase()){
   const updates={email:current.email,pendingEmail:firebase.firestore.FieldValue.delete(),emailChangeRequestedAt:firebase.firestore.FieldValue.delete(),emailChangeRequestedBy:firebase.firestore.FieldValue.delete()};
   const batch=window.shopkeepDb.batch();batch.update(memberships().doc(current.uid),updates);batch.update(collection('users').doc(current.uid),updates);
   batch.set(logsCollection().doc(),{action:'email_changed',actorUid:current.uid,actorEmail:current.email,actorRole:role,subjectUid:current.uid,subjectEmail:current.email,details:'Email change verified',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
   await batch.commit();pendingEmail='';
  }
 }else{
  if(claims.role==='customer'){location.replace(`../store/?store=${encodeURIComponent(claims.storeId||'')}`);return}
  storeId=claims.storeId||current.uid;
  role=['owner','admin','manager','staff','cashier'].includes(claims.role)?claims.role:(storeId==current.uid?'owner':'cashier');
 }
 const [products,sales,movements]=await Promise.all(['products','sales','stock_movements'].map(name=>collection(name).get()));
 if(products.empty&&storeId==current.uid&&P.length){
  const batch=window.shopkeepDb.batch();P.forEach(p=>batch.set(collection('products').doc(p.id),p));await batch.commit();
 }else P=products.docs.map(d=>({...d.data(),id:d.id}));
 let catalogSyncBlocked=false;
 const catalogBatch=window.shopkeepDb.batch();P.forEach(p=>catalogBatch.set(collection('public_products').doc(p.id),{id:p.id,name:p.name,cat:p.cat,emoji:p.emoji,price:p.price,stock:p.stock,imageUrl:p.imageUrl||''}));
 try{await catalogBatch.commit()}catch(error){console.warn('Public catalog sync is unavailable.',error);catalogSyncBlocked=true}
 S=sales.docs.map(d=>{const x=d.data();return{...x,id:d.id,t:dateValue(x.t)}});
 M=movements.docs.map(d=>{const x=d.data();return{...x,id:d.id,t:dateValue(x.t)}});
 render();
 if(catalogSyncBlocked)toast('Store loaded, but catalog sync is blocked. Deploy backend/firestore.rules.',1);
}
function status(p){return p.stock<=0?['out','Out of stock']:p.stock<=p.reorder?['low','Low · '+p.stock+' left']:['','In stock · '+p.stock]}
function toast(m,w){const t=$('#toast');t.innerHTML=`<div class="toast ${w?'warn':''}" role="status">${esc(m)}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',3200)}
function closeM(){$('#modal').innerHTML=''}
function modal(h){$('#modal').innerHTML=`<div class="modal" data-act="bg"><div class="box" role="dialog" aria-modal="true">${h}</div></div>`;const i=$('#modal input,#modal select');i&&i.focus()}

function nav(){
 const T=[['dash','▦','Dashboard'],['sell','＋','Sell'],['prods','▤','Products'],['orders','▣','Orders'],['log','⇅','Stock log']].filter(t=>ok(t[0]));
 const adminPages=ok('users')?`<div class="nav-section">User access</div><button class="tab ${view==='adduser'?'on':''}" data-act="go" data-v="adduser"><span>＋</span>Add user</button><button class="tab ${view==='users'?'on':''}" data-act="go" data-v="users"><span>♙</span>Manage users</button><button class="tab ${view==='userlogs'?'on':''}" data-act="go" data-v="userlogs"><span>◷</span>User logs</button>`:'';
 $('#nav').innerHTML=`<div class="brand">shop<i>keep</i></div>`+T.map(t=>`<button class="tab ${view===t[0]?'on':''}" data-act="go" data-v="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('')+adminPages+
 `<a class="shop-link" href="../store/?store=${encodeURIComponent(storeId)}">View online shop ↗</a><div class="who">${esc(user.email||'Signed in')}<small style="display:block;margin-top:4px">${ROLES[role]}</small><button class="btn sm" style="margin-top:8px" data-act="signout">Sign out</button></div>`;
}
function render(){
 if(!ok(view))view='sell';nav();document.body.classList.toggle('dashv',view=='dash');
 ({dash,sell,prods,log,orders,users,adduser,userlogs})[view]();
 if(pendingEmail)$('#main').insertAdjacentHTML('afterbegin',`<div class="alert">Email change requested: <b>${esc(pendingEmail)}</b>. Send a verification link, then sign in again with the new address. <button class="btn sm" data-act="verifyemail">Send verification email</button></div>`);
}
const low=()=>P.filter(p=>p.stock<=p.reorder);

function dash(){
 const today=S.filter(s=>s.status!='refunded'&&s.t.toDateString()==now().toDateString());
 const rev=today.reduce((a,s)=>a+s.total,0),avg=today.length?rev/today.length:0;
 const cost=P.reduce((a,p)=>a+p.cost*p.stock,0),retail=P.reduce((a,p)=>a+p.price*p.stock,0);
 const wk=[...WEEK,rev],mx=Math.max(...wk),days=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*864e5).toLocaleDateString([],{weekday:'short'}));
 const L=low(),slow=P.filter(p=>!S.some(s=>s.items.some(i=>i.id==p.id))&&p.stock>0);
 $('#main').innerHTML=`<div class="head"><div><h1>Today at the shop</h1><p>${now().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</p></div><button class="btn" data-act="csv" data-w="sales">Copy sales CSV</button></div>
 <div class="kpis"><div class="card kpi"><small>Sales today</small><b>${money(rev)}</b></div><div class="card kpi"><small>Transactions</small><b>${today.length}</b></div><div class="card kpi"><small>Average order</small><b>${money(avg)}</b></div><div class="card kpi"><small>Stock value (cost / retail)</small><b style="font-size:16px;padding-top:6px">${money(cost)} / ${money(retail)}</b></div></div>
 <div class="cols"><div class="card"><h2>Last 7 days</h2><div class="bars">${wk.map((v,i)=>`<div title="${money(v)}"><span style="height:${Math.max(4,v/mx*100)}%"></span>${days[i]}</div>`).join('')}</div></div>
 <div class="card"><h2>Needs restocking</h2>${L.length?L.map(p=>`<div class="line"><span style="font-size:22px">${p.emoji}</span><div class="n">${esc(p.name)}<small>Reorder at ${p.reorder}</small></div><span class="pill ${status(p)[0]}">${p.stock}</span></div>`).join(''):'<div class="empty">Everything is above its reorder level.</div>'}
 ${slow.length?`<p style="color:var(--mute);font-size:13px;margin:12px 0 0">Slow-moving, no sales yet: ${slow.slice(0,4).map(p=>esc(p.name)).join(', ')}</p>`:''}</div></div>
 <div class="card" style="margin-top:16px"><h2 style="margin-bottom:6px">Recent sales</h2><div class="scroll"><table><tr><th>Receipt</th><th>Time</th><th>Items</th><th class="num">Total</th><th>Status</th><th></th></tr>
 ${S.slice(0,8).map(s=>`<tr><td>${s.id}</td><td>${dm(s.t)}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)}</td><td class="num">${money(s.total)}</td><td><span class="pill ${s.status}">${s.status}</span></td><td class="num">${s.status!='refunded'&&ok('refund')?`<button class="btn sm bad" data-act="refund" data-id="${s.id}">Refund</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No sales yet. Open Sell to ring one up.</td></tr>'}</table></div></div>`;
}

function sell(){
 $('#main').innerHTML=`<div class="head"><div><h1>Sell</h1><p>Scan a barcode or tap a product.</p></div></div>
 ${low().length?`<div class="alert">${low().length} product${low().length>1?'s are':' is'} low or out of stock.</div>`:''}
 <div class="sell"><div><input id="q" placeholder="Scan barcode, type SKU or search…" value="${esc(q)}" autocomplete="off" aria-label="Scan or search products"><div class="tiles" id="tiles"></div></div><div class="receipt" id="cart"></div></div>`;
 const i=$('#q');i.oninput=()=>{q=i.value;tiles()};

async function createManagedUser(event){

  secondaryAuth=provisioningAuth();const credential=await secondaryAuth.createUserWithEmailAndPassword(email,password);newAccount=credential.user;
  const profile={uid:newAccount.uid,email,storeId,role:newRole,status:'active',createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:user.uid};

  await batch.commit();recordsSaved=true;await secondaryAuth.signOut();

  const snapshot=await collection('orders').orderBy('createdAt','desc').limit(100).get();onlineOrders=snapshot.docs.map(d=>({...d.data(),id:d.id}));
  $('#main').innerHTML=`<div class="head"><div><h1>Online orders</h1><p>Customer requests from the Shopkeep storefront · payment is arranged separately</p></div></div><div class="card"><div class="scroll"><table><tr><th>Order</th><th>Customer</th><th>Contact</th><th>Items</th><th class="num">Total</th><th>Status</th></tr>${onlineOrders.map(o=>`<tr><td>${esc(o.id.slice(0,8))}<small style="display:block;color:var(--mute)">${o.createdAt&&o.createdAt.toDate?dm(o.createdAt.toDate()):'Just now'}</small></td><td>${esc(o.customerName)}</td><td>${esc(o.phone)}<small style="display:block;color:var(--mute)">${esc(o.email||'')}</small></td><td>${(o.items||[]).map(i=>`${i.qty} × ${esc(i.name)}`).join('<br>')}</td><td class="num">${money(o.total)}</td><td><select data-act="orderstatus" data-id="${o.id}" aria-label="Order status"><option value="new" ${o.status==='new'?'selected':''}>New</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option><option value="ready" ${o.status==='ready'?'selected':''}>Ready</option><option value="completed" ${o.status==='completed'?'selected':''}>Completed</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option></select></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No online order requests yet.</td></tr>'}</table></div></div>`;
 }catch(error){$('#main').innerHTML=`<div class="head"><h1>Online orders</h1></div><div class="alert">${esc(error.message)}</div>`}
}
async function setOrderStatus(id,status){
 try{await collection('orders').doc(id).update({status});toast('Order status updated.');render()}
 catch(error){toast(error.message||'Could not update order.',1);render()}
}
async function refund(id){
 const s=S.find(x=>x.id==id);if(!s||s.status=='refunded')return;
 s.status='refunded';const movements=[],products=new Map();s.items.forEach(i=>{const p=P.find(p=>p.id==i.id);movements.push(mv(p,'return',i.qty,id));products.set(p.id,p)});
 if(await persistOrReload({sales:[s],products:[...products.values()],movements})){toast(`Refunded ${money(s.total)}. Stock restored.`);render()}
}
function csv(w){
 const rows=w=='sales'?[['id','time','total','status'],...S.map(s=>[s.id,s.t.toISOString(),s.total.toFixed(2),s.status])]:[['time','product','type','qty','ref','by'],...M.map(m=>[m.t.toISOString(),m.name,m.type,m.qty,m.ref,m.by])];
 const t=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
 try{navigator.clipboard.writeText(t).then(()=>toast('CSV copied to clipboard.'),()=>toast('Could not copy. Browser blocked clipboard.',1))}catch(e){toast('Could not copy. Browser blocked clipboard.',1)}
}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a=='bg'){if(e.target==b)closeM();return}
 if(a=='select')return;
 if(a=='signout'){window.shopkeepAuth.signOut().then(()=>location.assign('../login.html'));return}
 ({go:()=>{view=b.dataset.v;render()},add:()=>add(id),inc:()=>add(id),
 dec:()=>{const l=cart.find(x=>x.id==id);l.qty--;if(l.qty<1)cart=cart.filter(x=>x!=l);cartUI()},
 clear:()=>{cart=[];cartUI()},pay:payModal,confirm:confirmPay,close:closeM,print:()=>toast('Printing is handled by the browser in the live app.'),
 new:()=>prodForm(),edit:()=>prodForm(id),saveprod:()=>saveProd(id),adj:()=>adjModal(id),saveadj:()=>saveAdj(id),refund:()=>refund(id),csv:()=>csv(b.dataset.w),publishcatalog:publishCatalog,removeuser:()=>removeUserModal(id),removeuserconfirm:()=>removeUserAccess(id),sendreset:()=>sendUserPasswordEmail(id),changeemail:()=>changeUserEmailModal(id),saveemailrequest:()=>saveUserEmailRequest(id),verifyemail:verifyEmailChange}[a]||(()=>{}))();
});
document.addEventListener('change',e=>{
 const a=e.target.dataset.act;
 if(a=='disc'){disc=+e.target.value;cartUI()}
 if(a=='userrole')updateUserRole(e.target.dataset.id,e.target.value);
 if(a=='orderstatus')setOrderStatus(e.target.dataset.id,e.target.value);
});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
if(!window.shopkeepFirebaseConfigured){
 $('#nav').style.display='none';$('.shell').style.gridTemplateColumns='1fr';
 $('#main').innerHTML='<section class="auth-main"><h1>Connect Firebase</h1><div class="card"><p>Set your Firebase web app settings in <b>backend/firebase-config.js</b>, enable Email/Password Authentication, create a Firestore database, and deploy <b>backend/firestore.rules</b>.</p></div></section>';
}else window.shopkeepAuth.onAuthStateChanged(async current=>{
 if(!current){location.replace('../login.html');return}
 user=current;
 try{await loadStore(current)}catch(e){$('#main').innerHTML=`<section class="auth-main"><h1>Could not load store</h1><div class="card"><p>${esc(e.message)}</p><button class="btn" data-act="signout">Sign out</button></div></section>`}
});
