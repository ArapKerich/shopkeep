<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Shopkeep</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="brand">shop<i>keep</i></div>
    <section class="auth-card">
      <h1>Welcome back</h1>
      <p>Sign in to manage your store.</p>
      <form id="auth-form" class="auth-form" data-mode="signin">
        <label>Email address<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <p id="auth-error" class="auth-error" role="alert"></p>
        <button type="submit">Sign in</button>
        <button type="button" data-action="reset">Send password reset email</button>
      </form>
      <p class="auth-footer">New to Shopkeep? <a href="signup.html">Create an account</a></p>
    </section>
    <p class="auth-note">New accounts start with their own private store workspace.</p>
  </main>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase.js"></script>
  <script src="auth-page.js"></script>
</body>
</html>
